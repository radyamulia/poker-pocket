<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" width="100%" height="auto" role="img" aria-label="Diagram posisi dealer, small blind, dan big blind mengelilingi meja searah jarum jam">
  <defs>
    <radialGradient id="feltGradient" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1f3d2a"/>
      <stop offset="100%" stop-color="#122016"/>
    </radialGradient>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4ade80"/>
    </marker>
  </defs>

  <ellipse cx="180" cy="150" rx="150" ry="105" fill="url(#feltGradient)" stroke="#3a3f4b" stroke-width="2"/>

  <path d="M 260 90 A 110 80 0 0 1 260 210" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#arrowhead)"/>

  <!-- Dealer seat (top) -->
  <circle cx="180" cy="55" r="26" fill="#f5f5f0"/>
  <text x="180" y="61" text-anchor="middle" font-size="18" font-weight="700" fill="#16171b" font-family="system-ui, sans-serif">D</text>
  <text x="180" y="95" text-anchor="middle" font-size="13" fill="#e5e7eb" font-family="system-ui, sans-serif">Dealer</text>

  <!-- Small Blind seat (right) -->
  <circle cx="300" cy="150" r="26" fill="#facc15"/>
  <text x="300" y="156" text-anchor="middle" font-size="15" font-weight="700" fill="#16171b" font-family="system-ui, sans-serif">SB</text>
  <text x="300" y="190" text-anchor="middle" font-size="13" fill="#e5e7eb" font-family="system-ui, sans-serif">Small Blind</text>

  <!-- Big Blind seat (bottom) -->
  <circle cx="180" cy="245" r="26" fill="#f97316"/>
  <text x="180" y="251" text-anchor="middle" font-size="14" font-weight="700" fill="#16171b" font-family="system-ui, sans-serif">BB</text>
  <text x="180" y="285" text-anchor="middle" font-size="13" fill="#e5e7eb" font-family="system-ui, sans-serif">Big Blind</text>

  <!-- Other players (left side, generic) -->
  <circle cx="60" cy="150" r="20" fill="#2b2f38" stroke="#3a3f4b" stroke-width="1.5"/>
  <text x="60" y="155" text-anchor="middle" font-size="11" fill="#9ca3af" font-family="system-ui, sans-serif">Pemain</text>

  <text x="180" y="150" text-anchor="middle" font-size="12" fill="#6b7280" font-family="system-ui, sans-serif">searah jarum jam tiap hand baru</text>
</svg>
